[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "txqr-restore"
version = "0.1.0"
description = "Verified, resumable TXQRT1 QR-video receiver"
requires-python = ">=3.10"
dependencies = ["zxing-cpp==2.3.0", "opencv-python-headless==4.14.0.94", "numpy==2.1.3"]

[project.scripts]
txqr-restore = "txqr_restore.cli:main"

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
