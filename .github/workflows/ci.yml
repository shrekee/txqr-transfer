name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: sender-go/go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt -e ./receiver-python --no-deps
      - name: Go tests and vet
        working-directory: sender-go
        run: go test -race ./... && go vet ./...
      - name: Python unit and synthetic-video acceptance
        run: python -m pytest receiver-python/tests tests -q
      - name: Release packaging tests
        run: python -m unittest discover -s scripts -p 'test_release.py' -v
